# Define user and worker processes
user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP server to redirect to HTTPS
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;  # Redirect to HTTPS
        }
    }

    # HTTPS server configuration
    server {
        listen 443 ssl;
        server_name localhost;  # Change this to your domain if needed

        # Specify the SSL certificate and key
        ssl_certificate C:\Users\praha\OneDrive\Desktop\newatten\cert\ssl\certs\cert.pem;
        ssl_certificate_key C:\Users\praha\OneDrive\Desktop\newatten\privatekey\ssl\private\key.pem;

        location / {
            proxy_pass http://127.0.0.1:5000;  # Forward requests to your Flask app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;  # Custom error page
        location = /50x.html {
            root html;  # Location for error pages
        }
    }
}
